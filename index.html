<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f47b00">
<link rel="manifest" href="./manifest.json?v=20261004-v14">
<link rel="icon" type="image/png" sizes="192x192" href="./FNB_Control_192.png">
<link rel="apple-touch-icon" href="./FNB_Control_192.png">
<title>F&B Control Center</title>
<style>
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#eef1f3;color:#20262d}
body{overflow:hidden}.app{height:100%;display:flex;flex-direction:column}.top{background:linear-gradient(135deg,#20262d,#303943 55%,#f47b00);color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 4px 18px rgba(0,0,0,.14)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:12px}.title{font-size:18px;font-weight:900}.sub{font-size:11px;opacity:.82;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{border:0;border-radius:9px;padding:9px 11px;font-weight:800;cursor:pointer}.install{background:#f47b00;color:#fff}.home{background:rgba(255,255,255,.14);color:#fff;display:none}
main{flex:1;overflow:auto;padding:12px}.hero{background:linear-gradient(135deg,#263238,#6e5234);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.hero h2{margin:0;font-size:19px}.hero p{margin:5px 0 0;font-size:12px;opacity:.82}.search{width:100%;padding:11px;border:1px solid #ccd3d7;border-radius:10px;margin-bottom:12px;font-size:14px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.08)}.bar{height:48px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;background:#263238;color:#fff}.bar.orange{background:#ff8a12}.icon{font-size:24px}.status{font-size:9px;font-weight:900;background:#17b56a;padding:4px 7px;border-radius:999px}.body{padding:11px}.body h3{margin:0 0 4px;font-size:12px}.body p{margin:0 0 10px;color:#68737c;font-size:10px;min-height:28px}.open{display:block;width:100%;padding:9px;border:0;border-radius:8px;background:#f47b00;color:#fff;font-weight:900;text-align:center;text-decoration:none;font-size:10px}.shell{position:fixed;inset:0;background:#eef1f3;display:none;z-index:10}.shellHead{height:54px;background:#263238;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px}.shellTitle{font-weight:900;font-size:13px}.back{background:#f47b00;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-weight:900}.frame{width:100%;height:calc(100% - 54px);border:0;background:#fff}
@media(max-width:620px){.grid{grid-template-columns:1fr}.top{padding:12px}.title{font-size:16px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><img class="logo" src="./FNB_Control_192.png"><div><div class="title">F&B CONTROL CENTER</div><div class="sub">Blue Reef Resort • Food & Beverage Management System</div></div></div>
    <div class="actions"><button id="installBtn" class="btn install" style="display:none">📲 INSTALL APP</button></div>
  </header>
  <main>
    <section class="hero"><h2>F&B Financial Control System</h2><p>Sales • Inventory • Cost Control • Analytics • Management Intelligence</p></section>
    <input id="search" class="search" placeholder="Search modules..." oninput="render()">
    <div id="grid" class="grid"></div>
  </main>
</div>
<div id="shell" class="shell">
  <div class="shellHead"><div id="shellTitle" class="shellTitle">Module</div><button class="back" onclick="closeModule()">← HOME</button></div>
  <iframe id="frame" class="frame" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<script>
'use strict';
const APP_URL='https://script.google.com/macros/s/AKfycbzz8o-X8e_z0jgXza8kwC9fL6eFvmy8Ngzbhc0aeqQN9wtuIwAQIsfwcGi491KtCGp2Xg/exec';
const MODULES=[
 {icon:'🧾',title:'POS CHECKS',desc:'Create and manage checks.',page:'pos',type:'remote',theme:'orange'},
 {icon:'🔎',title:'CHECK SEARCH',desc:'Search, view, edit, void and print checks.',page:'search',type:'remote',theme:'dark'},
 {icon:'📦',title:'INVENTORY & STOCK',desc:'Stock control and monthly closing.',page:'inventory',type:'remote',theme:'dark'},
 {icon:'📊',title:'REPORTS & DASHBOARD',desc:'Sales, outlet and financial reports.',page:'reports',type:'remote',theme:'orange'},
 {icon:'📈',title:'F&B ANALYTICS',desc:'Analytics with Hybrid AI management interpretation.',page:'analytics',type:'local',theme:'orange'},
 {icon:'🧠',title:'MANAGEMENT INTELLIGENCE',desc:'AI-powered management analysis and actions.',page:'management',type:'local',theme:'orange'},
 {icon:'🛠️',title:'MASTER DATA',desc:'Products, staff, outlets and settings.',page:'master',type:'remote',theme:'dark'},
 {icon:'🔐',title:'AUDIT & SECURITY',desc:'Audit trail and control activity.',page:'audit',type:'remote',theme:'orange'},
 {icon:'💾',title:'SYSTEM BACKUP',desc:'Protected backup operations.',page:'backup',type:'remote',theme:'dark'},
 {icon:'🔧',title:'SYSTEM REPAIR',desc:'Setup, repair and restore core system structure.',page:'repair',type:'remote',theme:'dark'},
 {icon:'🔢',title:'CHECK SEQUENCE',desc:'Manage global check-number sequences.',page:'sequence',type:'remote',theme:'orange'},
 {icon:'✅',title:'PRODUCTION READINESS',desc:'Run system readiness and production tests.',page:'readiness',type:'remote',theme:'dark'},
 {icon:'💱',title:'EXCHANGE RATES',desc:'Manage currencies and exchange rates.',page:'exchange',type:'remote',theme:'orange'}
];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]||m))}
function render(){const q=(document.getElementById('search').value||'').toLowerCase().trim();const rows=MODULES.filter(m=>!q||((m.title+' '+m.desc).toLowerCase().includes(q)));document.getElementById('grid').innerHTML=rows.map(m=>`<article class="card"><div class="bar ${m.theme==='orange'?'orange':''}"><div class="icon">${m.icon}</div><span class="status">${m.type==='local'?'AI LIVE':'LIVE'}</span></div><div class="body"><h3>${esc(m.title)}</h3><p>${esc(m.desc)}</p><a href="#" class="open" onclick="openModule('${m.page}','${m.type}','${m.title.replace(/'/g,"\'")}');return false">OPEN →</a></div></article>`).join('')}
function openModule(page,type,title){history.pushState({page},'', '#'+page);document.getElementById('shellTitle').textContent=title;document.getElementById('shell').style.display='block';const frame=document.getElementById('frame');if(type==='local'){frame.src='./'+page+'.html?v=20261004-v13'}else{frame.src=APP_URL+'?page='+encodeURIComponent(page)};}
function closeModule(){document.getElementById('shell').style.display='none';document.getElementById('frame').src='about:blank';if(location.hash){history.pushState({page:'home'},'', '#home')}}
window.addEventListener('popstate',()=>{if(location.hash===''||location.hash==='#home')closeModule();});
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='inline-block'});
document.getElementById('installBtn').addEventListener('click',async()=>{if(!deferredPrompt){alert('Use Chrome menu ⋮ → Add to Home screen → Install app.');return;}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById('installBtn').style.display='none'});
window.addEventListener('appinstalled',()=>{document.getElementById('installBtn').style.display='none'});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=20261004-v14',{updateViaCache:'none'}).then(r=>r.update&&r.update()).catch(()=>{}));}
render();
</script>
</body>
</html>
