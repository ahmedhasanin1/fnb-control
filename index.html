<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f47b00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="F&B Control">
<link rel="manifest" href="./manifest.json?v=20261004-v12">
<link rel="icon" type="image/png" sizes="192x192" href="./FNB_Control_192.png">
<link rel="apple-touch-icon" href="./FNB_Control_192.png">
<title>F&B Control</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#eef1f3;
  font-family:Arial,sans-serif;
  overflow:hidden
}
#app{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  background:#eef1f3
}
#loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#eef1f3;
  z-index:5
}
.card{
  width:min(88%,380px);
  padding:28px 22px;
  border-radius:24px;
  background:#fff;
  box-shadow:0 14px 40px rgba(20,28,36,.14);
  text-align:center
}
.icon{
  width:92px;
  height:92px;
  border-radius:22px;
  margin:0 auto 16px;
  box-shadow:0 8px 22px rgba(20,28,36,.18)
}
h1{
  margin:0;
  color:#20262d;
  font-size:22px
}
p{
  color:#68737c;
  font-size:13px;
  line-height:1.5;
  margin:10px 0 0
}
.error{
  display:none;
  margin-top:16px;
  color:#b42318;
  font-size:12px;
  line-height:1.5
}
</style>
</head>

<body>

<div id="loading">
  <div class="card">
    <img class="icon" src="./FNB_Control_192.png" alt="F&B Control">
    <h1>F&B CONTROL</h1>
    <p>Opening Blue Reef F&B Control Center…</p>
    <div id="err" class="error">
      The system could not be loaded. Please check the internet connection.
    </div>
  </div>
</div>

<iframe
  id="app"
  title="Blue Reef F&B Control Center"
  allow="clipboard-read; clipboard-write; fullscreen"
  referrerpolicy="strict-origin-when-cross-origin">
</iframe>

<script>
'use strict';

const APP_URL =
'https://script.google.com/macros/s/AKfycbzz8o-X8e_z0jgXza8kwC9fL6eFvmy8Ngzbhc0aeqQN9wtuIwAQIsfwcGi491KtCGp2Xg/exec';

const frame = document.getElementById('app');
const loading = document.getElementById('loading');
const err = document.getElementById('err');

const ALLOWED = [
  'mobile',
  'pos',
  'search',
  'checkedit',
  'inventory',
  'reports',
  'analytics',
  'management',
  'master',
  'audit',
  'backup',
  'repair',
  'sequence',
  'readiness',
  'exchange'
];

let currentPage = '';

function readHashPage(){
  const hash = (window.location.hash || '').replace(/^#/, '').trim();

  if(hash === '' || hash === 'home'){
    return 'mobile';
  }

  return ALLOWED.indexOf(hash) >= 0 ? hash : 'mobile';
}

function moduleUrl(page){
  if(String(page) === 'management'){
    return './management.html?v=20261004-v12';
  }
  return APP_URL + '?page=' + encodeURIComponent(page);
}

function loadFromHash(){
  const page = readHashPage();

  if(page === currentPage){
    return;
  }

  currentPage = page;
  loading.style.display = 'flex';
  frame.src = moduleUrl(page);
}

/*
  Native URL-hash navigation only:
  Home -> #pos creates normal browser history.
  Android Back -> #home restores Home.
*/
window.addEventListener('hashchange', loadFromHash);
window.addEventListener('popstate', loadFromHash);

if(!window.location.hash){
  history.replaceState(
    {fnbPage:'mobile'},
    '',
    '#home'
  );
}

loadFromHash();

frame.addEventListener('load', function(){
  loading.style.display = 'none';
});

setTimeout(function(){
  if(loading.style.display !== 'none'){
    err.style.display = 'block';
  }
}, 12000);

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register(
      './sw.js?v=20261004-v12',
      {updateViaCache:'none'}
    ).then(function(reg){
      return reg.update ? reg.update() : null;
    }).catch(function(){});
  });
}
</script>

</body>
</html>
