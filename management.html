<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Management Action Center</title>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1f3;
      color: #20262d;
    }

    .app {
      max-width: 760px;
      margin: auto;
      padding-bottom: 30px;
    }

    /* HEADER */

    .header {
      background: linear-gradient(
        135deg,
        #20262d,
        #303943
      );

      color: white;
      padding:
        calc(18px + env(safe-area-inset-top))
        18px
        18px;

      position: sticky;
      top: 0;
      z-index: 20;

      box-shadow:
        0 3px 12px rgba(0,0,0,.18);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #f47b00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: bold;
    }

    .title {
      font-size: 18px;
      font-weight: 800;
    }

    .subtitle {
      font-size: 11px;
      opacity: .75;
      margin-top: 3px;
    }

    .refresh-btn {
      border: 0;
      background: rgba(255,255,255,.12);
      color: white;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .refresh-btn:active {
      transform: scale(.96);
    }

    /* PERIOD */

    .period {
      background: white;
      margin: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
      font-size: 12px;
      color: #69737c;
    }

    .period strong {
      color: #20262d;
    }

    /* PERIOD SELECTOR */

    .period-selector {
      background: white;
      margin: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
    }

    .period-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .period-field label {
      display: block;
      font-size: 9px;
      font-weight: 800;
      color: #6f7880;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .period-field input {
      width: 100%;
      height: 38px;
      border: 1px solid #dfe4e8;
      border-radius: 9px;
      padding: 0 9px;
      font-size: 11px;
      color: #20262d;
      background: #fff;
    }

    .period-actions {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .period-btn {
      flex: 1;
      border: 0;
      border-radius: 9px;
      min-height: 36px;
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
    }

    .period-btn.apply {
      background: #f47b00;
      color: #fff;
    }

    .period-btn.reset {
      background: #eef1f3;
      color: #303943;
    }

    .period-error {
      display: none;
      margin-top: 8px;
      color: #c62828;
      font-size: 9px;
      font-weight: 700;
    }

    /* STATUS */

    .status-card {
      margin: 12px;
      padding: 18px;
      border-radius: 16px;
      color: white;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
    }

    .status-card.healthy {
      background: #2e7d32;
    }

    .status-card.monitor {
      background: #c47b00;
    }

    .status-card.attention {
      background: #c62828;
    }

    .status-label {
      font-size: 11px;
      text-transform: uppercase;
      opacity: .8;
      letter-spacing: .6px;
    }

    .status-value {
      font-size: 25px;
      font-weight: 900;
      margin-top: 5px;
    }

    .status-message {
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.5;
      opacity: .95;
    }

    /* SECTION */

    .section-title {
      margin: 20px 14px 9px;
      font-size: 14px;
      font-weight: 900;
      color: #303943;
    }

    /* KPI GRID */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 0 12px;
    }

    .kpi {
      background: white;
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 2px 7px rgba(0,0,0,.06);
      min-height: 88px;
    }

    .kpi-label {
      font-size: 10px;
      color: #7a848d;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .kpi-value {
      font-size: 21px;
      font-weight: 900;
      margin-top: 7px;
      color: #20262d;
      word-break: break-word;
    }

    .kpi.orange .kpi-value {
      color: #f47b00;
    }

    .kpi.red .kpi-value {
      color: #c62828;
    }

    .kpi.green .kpi-value {
      color: #2e7d32;
    }

    /* ACTIONS */

    html += `

      <div class="section-title">
        Management Actions
      </div>

    `;

    function firstValue(obj, keys) {
      if (!obj) return null;
      for (var i = 0; i < keys.length; i++) {
        if (obj[keys[i]] !== undefined && obj[keys[i]] !== null && obj[keys[i]] !== '') {
          return obj[keys[i]];
        }
      }
      return null;
    }

    function detailMoney(value) {
      return value === null || value === undefined || value === ''
        ? '—'
        : money(value);
    }

    function detailNumber(value) {
      return value === null || value === undefined || value === ''
        ? '—'
        : number(value, 2);
    }

    function detailProductName(item) {
      return firstValue(item, [
        'productName',
        'productNameSnapshot',
        'name',
        'Product Name'
      ]) || 'Unknown Product';
    }

    function detailProductId(item) {
      return firstValue(item, [
        'productId',
        'Product ID',
        'id'
      ]) || '';
    }

    function renderDetailItem(item, type) {
      var name = detailProductName(item);
      var id = detailProductId(item);
      var html = `
        <div class="detail-item">
          <div class="detail-item-top">
            <div>
              <div class="detail-name">${esc(name)}</div>
              ${id ? `<div class="detail-id">${esc(id)}</div>` : ''}
            </div>
          </div>
      `;

      if (type === 'MISSING_COST') {
        html += `
          <div class="detail-values">
            <div class="detail-value"><span>Sales</span><strong>${detailMoney(firstValue(item,['sales','salesAmount']))}</strong></div>
            <div class="detail-value"><span>Qty Sold</span><strong>${detailNumber(firstValue(item,['quantitySold','qtySold','quantity']))}</strong></div>
            <div class="detail-value"><span>Cost</span><strong>Missing</strong></div>
          </div>
        `;
      } else if (type === 'NEGATIVE_STOCK') {
        html += `
          <div class="detail-values">
            <div class="detail-value"><span>Current Stock</span><strong>${detailNumber(firstValue(item,['currentStock','stock','balance','qty']))}</strong></div>
            <div class="detail-value"><span>Unit</span><strong>${esc(firstValue(item,['unit','inventoryUnit']) || '—')}</strong></div>
            <div class="detail-value"><span>Status</span><strong>NEGATIVE</strong></div>
          </div>
        `;
      } else if (type === 'QUANTITY_MISMATCH') {
        html += `
          <div class="detail-values">
            <div class="detail-value"><span>Sold Qty</span><strong>${detailNumber(firstValue(item,['soldQuantity','quantitySold','soldQty']))}</strong></div>
            <div class="detail-value"><span>Movement Qty</span><strong>${detailNumber(firstValue(item,['movementQuantity','inventoryQuantity','movementQty']))}</strong></div>
            <div class="detail-value"><span>Difference</span><strong>${detailNumber(firstValue(item,['difference','quantityDifference','variance']))}</strong></div>
          </div>
        `;
      } else if (type === 'NO_INVENTORY_MOVEMENT') {
        html += `
          <div class="detail-values">
            <div class="detail-value"><span>Sales</span><strong>${detailMoney(firstValue(item,['sales','salesAmount']))}</strong></div>
            <div class="detail-value"><span>Qty Sold</span><strong>${detailNumber(firstValue(item,['quantitySold','qtySold','quantity']))}</strong></div>
            <div class="detail-value"><span>Movement</span><strong>None</strong></div>
          </div>
        `;
      } else if (type === 'MASTER_MISSING') {
        html += `
          <div class="detail-values">
            <div class="detail-value"><span>Product</span><strong>${esc(name)}</strong></div>
            <div class="detail-value"><span>Product ID</span><strong>${esc(id || '—')}</strong></div>
            <div class="detail-value"><span>Status</span><strong>Missing</strong></div>
          </div>
        `;
      } else {
        html += `
          <div class="detail-values">
            <div class="detail-value"><span>Value</span><strong>${esc(firstValue(item,['value','amount','difference']) ?? '—')}</strong></div>
            <div class="detail-value"><span>Percent</span><strong>${percent(firstValue(item,['percent','differencePercent']))}</strong></div>
            <div class="detail-value"><span>Type</span><strong>${esc(type || 'DETAIL')}</strong></div>
          </div>
        `;
      }

      html += `</div>`;
      return html;
    }

    function getActionDetails(action) {
      var details = data.details || {};
      var type = String(action.type || '').toUpperCase();

      if (type === 'MISSING_COST') {
        return details.missingCostProducts || [];
      }
      if (type === 'NEGATIVE_STOCK') {
        return details.negativeStockProducts || [];
      }
      if (type === 'QUANTITY_MISMATCH') {
        return details.quantityMismatchProducts || [];
      }
      if (type === 'NO_INVENTORY_MOVEMENT') {
        return details.noInventoryMovementProducts || [];
      }
      if (type === 'MASTER_MISSING') {
        return details.masterMissingProducts || [];
      }
      return [];
    }

    if (!actions.length) {

      html += `

        <div class="empty">

          ✓ No immediate management actions detected.

        </div>

      `;

    } else {

      actions.forEach(
        function(action, actionIndex) {

          var priority =
            String(
              action.priority ||
              'MEDIUM'
            ).toLowerCase();

          var type = String(action.type || '').toUpperCase();
          var detailsList = getActionDetails(action);
          var detailCount = detailsList.length;
          var hasDetails = detailCount > 0;
          var value = action.value;
          var pct = action.percent;

          html += `

            <div class="action ${priority}" id="action-${actionIndex}">

              <div class="action-top action-head" onclick="toggleAction(${actionIndex})">

                <div class="action-title-wrap">
                  <button class="action-toggle" type="button" id="toggle-${actionIndex}" onclick="event.stopPropagation(); toggleAction(${actionIndex})">${hasDetails ? '+' : '•'}</button>
                  <div class="action-title">
                    ${esc(
                      action.title ||
                      action.type
                    )}
                  </div>
                </div>

                <div class="priority ${priority}">

                  ${esc(
                    action.priority ||
                    'MEDIUM'
                  )}

                </div>

              </div>

              <div class="action-message">

                ${esc(
                  action.message ||
                  ''
                )}

              </div>

              ${value !== undefined && value !== null || pct !== undefined && pct !== null ? `
                <div class="action-value">
                  ${value !== undefined && value !== null ? `Value: <strong>${money(value)}</strong>` : ''}
                  ${value !== undefined && value !== null && pct !== undefined && pct !== null ? ' &nbsp;•&nbsp; ' : ''}
                  ${pct !== undefined && pct !== null ? `Difference: <strong>${percent(pct)}</strong>` : ''}
                </div>
              ` : ''}

              <div class="action-do">

                Action:
                ${esc(
                  action.action ||
                  ''
                )}

              </div>

              <div class="action-details" id="details-${actionIndex}">
                ${hasDetails ? `
                  <div class="detail-summary">
                    <div class="detail-stat">
                      <div class="detail-stat-label">Affected Items</div>
                      <div class="detail-stat-value">${number(detailCount)}</div>
                    </div>
                    <div class="detail-stat">
                      <div class="detail-stat-label">Issue Type</div>
                      <div class="detail-stat-value">${esc(type || 'ACTION')}</div>
                    </div>
                  </div>
                  <div class="detail-list">
                    ${detailsList.map(function(item) {
                      return renderDetailItem(item, type);
                    }).join('')}
                  </div>
                ` : `
                  <div class="detail-empty">No item-level details are available for this action.</div>
                `}
              </div>

            </div>

          `;

        }
      );

    }

    /* FOOTER */

    .footer {
      text-align: center;
      color: #89929a;
      font-size: 10px;
      padding: 25px 15px 10px;
    }

    @media (min-width: 700px) {

      .app {
        max-width: 900px;
      }

      .grid {
        grid-template-columns:
          repeat(4, 1fr);
      }

    }

  
/* =========================================================
   HYBRID AI MANAGEMENT INTELLIGENCE
   ========================================================= */
.ai-panel{
  margin-top:18px;
  border:1px solid #d9e1e6;
  border-radius:14px;
  overflow:hidden;
  background:#fff;
}
.ai-head{
  background:linear-gradient(135deg,#263238,#394952);
  color:#fff;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.ai-head-left{display:flex;align-items:center;gap:10px}
.ai-icon{
  width:36px;height:36px;border-radius:10px;
  background:#f47b00;color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:18px;
}
.ai-title{font-weight:800;font-size:14px}
.ai-subtitle{font-size:10px;opacity:.75;margin-top:2px}
.ai-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 8px;border-radius:999px;
  background:#1ebc6a;color:#fff;font-size:9px;font-weight:800;
}
.ai-body{padding:16px}
.ai-loading{
  display:flex;align-items:center;gap:10px;
  color:#607078;font-size:12px;padding:8px 0;
}
.ai-spinner{
  width:16px;height:16px;border:2px solid #dfe5e8;
  border-top-color:#f47b00;border-radius:50%;
  animation:aiSpin .8s linear infinite;
}
@keyframes aiSpin{to{transform:rotate(360deg)}}
.ai-summary{
  background:#fff8f0;border-left:4px solid #f47b00;
  padding:12px;border-radius:8px;margin-bottom:14px;
  font-size:13px;line-height:1.55;
}
.ai-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;
}
.ai-box{
  border:1px solid #e6ebee;border-radius:10px;
  padding:12px;background:#fbfcfd;
}
.ai-box h4{margin:0 0 8px;font-size:12px;color:#263238}
.ai-list{margin:0;padding-left:18px;font-size:11px;line-height:1.55}
.ai-list li{margin:4px 0}
.ai-action{
  border:1px solid #e2e7ea;border-radius:10px;
  padding:11px;margin:8px 0;background:#fff;
}
.ai-action-top{
  display:flex;justify-content:space-between;gap:10px;
  font-size:11px;font-weight:800;
}
.ai-priority{
  border-radius:999px;padding:3px 7px;font-size:9px;
  font-weight:800;white-space:nowrap;
}
.ai-priority.high{background:#ffebee;color:#b71c1c}
.ai-priority.medium{background:#fff3e0;color:#e65100}
.ai-priority.low{background:#e8f5e9;color:#2e7d32}
.ai-action p{margin:7px 0 0;font-size:11px;line-height:1.5}
.ai-action .ai-why{color:#607078}
.ai-footer{
  margin-top:12px;padding-top:10px;border-top:1px solid #edf0f2;
  font-size:9px;color:#7a858c;line-height:1.5;
}
.ai-refresh{
  border:0;background:#f47b00;color:#fff;border-radius:8px;
  padding:8px 11px;font-weight:800;font-size:10px;cursor:pointer;
}
.ai-error{
  background:#fff4f4;border:1px solid #ffd3d3;color:#a61b1b;
  border-radius:10px;padding:12px;font-size:11px;line-height:1.5;
}
@media(max-width:700px){
  .ai-grid{grid-template-columns:1fr}
  .ai-head{align-items:flex-start}
}

/* PRINT / PDF */
@media print{
  @page{size:A4 portrait;margin:8mm}

  html,body{
    background:#fff !important;
    color:#20262d !important;
    overflow:visible !important;
  }

  body{
    font-size:10px !important;
  }

  .app{
    max-width:none !important;
    width:100% !important;
    padding:0 !important;
  }

  .header{
    position:static !important;
    box-shadow:none !important;
    padding:10px 0 12px !important;
    border-bottom:2px solid #f47b00 !important;
  }

  .header-row{
    justify-content:center !important;
  }

  .refresh-btn,
  .print-btn,
  .period-selector,
  .ai-refresh{
    display:none !important;
  }

  .period{
    margin:8px 0 !important;
    padding:7px 0 !important;
    border-radius:0 !important;
    box-shadow:none !important;
    border-bottom:1px solid #ddd !important;
  }

  .section-title{
    margin:12px 0 6px !important;
    font-size:11px !important;
    page-break-after:avoid !important;
  }

  .grid{
    padding:0 !important;
    gap:6px !important;
  }

  .kpi{
    min-height:52px !important;
    padding:7px !important;
    box-shadow:none !important;
    border:1px solid #ddd !important;
  }

  .kpi-label{font-size:7px !important}
  .kpi-value{font-size:12px !important;margin-top:3px !important}

  .status-card{
    margin:8px 0 !important;
    padding:10px !important;
    box-shadow:none !important;
    page-break-inside:avoid !important;
  }

  .status-value{font-size:16px !important}
  .status-message{font-size:9px !important}

  .recon{
    box-shadow:none !important;
    border:1px solid #ddd !important;
    page-break-inside:avoid !important;
  }

  .action,
  .ai-panel,
  .ai-box,
  .ai-action,
  .ai-summary{
    page-break-inside:avoid !important;
  }

  .ai-panel{
    box-shadow:none !important;
    border:1px solid #dfe4e7 !important;
  }

  .ai-head{
    position:static !important;
    padding:8px !important;
  }

  .ai-body{padding:8px !important}
  .ai-grid{gap:6px !important}
  .ai-box{padding:7px !important}
  .ai-box h4{font-size:9px !important}
  .ai-list{font-size:8px !important;line-height:1.35 !important}
  .ai-action{padding:7px !important}
  .ai-action-top{font-size:8px !important}
  .ai-action p{font-size:8px !important}
  .ai-footer{font-size:7px !important}

  .footer{
    margin-top:10px !important;
    padding-top:5px !important;
    border-top:1px solid #bbb !important;
    font-size:7px !important;
    page-break-inside:avoid !important;
  }
}

</style>
</head>


<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="header-row">

      <div class="brand">

        <div class="brand-icon">
          F&B
        </div>

        <div>

          <div class="title">
            Management Action Center
          </div>

          <div class="subtitle">
            Blue Reef Resort • F&B Control
          </div>

        </div>

      </div>

      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">

        <button
          class="refresh-btn print-btn"
          type="button"
          onclick="printManagementReport()">

          🖨 Print / PDF

        </button>

        <button
          class="refresh-btn print-btn"
          type="button"
          onclick="goPwaHome()">

          🏠 Home

        </button>

        <button
          class="refresh-btn"
          onclick="loadData()">

          ↻ Refresh

        </button>

      </div>

    </div>

  </div>


  <!-- PERIOD SELECTOR -->

  <div class="period-selector">

    <div class="period-grid">

      <div class="period-field">
        <label for="managementFrom">From</label>
        <input id="managementFrom" type="date">
      </div>

      <div class="period-field">
        <label for="managementTo">To</label>
        <input id="managementTo" type="date">
      </div>

    </div>

    <div class="period-actions">
      <button class="period-btn apply" type="button" onclick="applyPeriod()">APPLY</button>
      <button class="period-btn reset" type="button" onclick="resetPeriod()">RESET</button>
    </div>

    <div id="periodError" class="period-error"></div>

  </div>

  <!-- CONTENT -->

  <div id="content">

    <div class="loading">

      <div class="spinner"></div>

      Loading Management Intelligence...

    </div>

  </div>


</div>


<script>

  /* =========================================================
     STATIC GITHUB MODE
     Apps Script is used only as a JSONP backend.
     This page itself is hosted on GitHub Pages, so the
     Google Apps Script warning banner never appears.
     ========================================================= */
  var FNB_API_URL =
    'https://script.google.com/macros/s/AKfycbzz8o-X8e_z0jgXza8kwC9fL6eFvmy8Ngzbhc0aeqQN9wtuIwAQIsfwcGi491KtCGp2Xg/exec';

  var FNB_JSONP_SEQ = 0;

  function callFnbApi(api, params, onSuccess, onError) {
    var callbackName = '__fnbJsonp_' + Date.now() + '_' + (++FNB_JSONP_SEQ);
    var script = document.createElement('script');
    var query = [];

    params = params || {};

    Object.keys(params).forEach(function(key){
      var value = params[key];
      if (value === undefined || value === null) return;
      query.push(
        encodeURIComponent(key) + '=' + encodeURIComponent(String(value))
      );
    });

    query.push('api=' + encodeURIComponent(api));
    query.push('callback=' + encodeURIComponent(callbackName));
    query.push('_=' + Date.now());

    var cleaned = false;

    function cleanup(){
      if (cleaned) return;
      cleaned = true;
      try { delete window[callbackName]; } catch(e) { window[callbackName] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(result){
      cleanup();
      if (typeof onSuccess === 'function') onSuccess(result);
    };

    script.onerror = function(){
      cleanup();
      if (typeof onError === 'function') onError('Management API request failed.');
    };

    document.body.appendChild(script);

    script.src = FNB_API_URL + '?' + query.join('&');

    window.setTimeout(function(){
      if (!cleaned) {
        cleanup();
        if (typeof onError === 'function') onError('Management API request timed out.');
      }
    }, 30000);
  }

  function esc(value) {

    return String(
      value === null ||
      value === undefined
        ? ''
        : value
    )
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

  }


  function number(value, decimals) {

    var n = Number(value || 0);

    if (!isFinite(n)) {
      n = 0;
    }

    return n.toLocaleString(
      'en-US',
      {
        minimumFractionDigits:
          decimals === undefined
            ? 0
            : decimals,

        maximumFractionDigits:
          decimals === undefined
            ? 0
            : decimals
      }
    );

  }


  function money(value) {

    return number(value, 2) + ' EGP';

  }


  function percent(value) {

    if (
      value === null ||
      value === undefined ||
      value === ''
    ) {
      return '—';
    }

    return number(value, 2) + '%';

  }


  function statusClass(status) {

    status =
      String(
        status || ''
      ).toUpperCase();

    if (status === 'HEALTHY') {
      return 'healthy';
    }

    if (status === 'MONITOR') {
      return 'monitor';
    }

    return 'attention';

  }


  function statusText(status) {

    status =
      String(
        status || ''
      ).toUpperCase();

    if (status === 'HEALTHY') {
      return 'HEALTHY';
    }

    if (status === 'MONITOR') {
      return 'MONITOR';
    }

    return 'ATTENTION REQUIRED';

  }


  function toggleAction(index) {
    var card = document.getElementById('action-' + index);
    var button = document.getElementById('toggle-' + index);
    if (!card) return;

    var open = card.classList.toggle('open');
    if (button) {
      button.textContent = open ? '−' : '+';
    }
  }

  function loadData() {

    var from = document.getElementById('managementFrom').value;
    var to = document.getElementById('managementTo').value;

    document.getElementById('periodError').style.display = 'none';

    if (!from || !to) {
      showPeriodError('Please select both From and To dates.');
      return;
    }

    if (from > to) {
      showPeriodError('From date cannot be later than To date.');
      return;
    }

    document.getElementById(
      'content'
    ).innerHTML = `

      <div class="loading">

        <div class="spinner"></div>

        Updating Management Intelligence...

      </div>

    `;

    callFnbApi(
      'management',
      {
        from: from,
        to: to,
        outletId: '',
        poolId: ''
      },
      function(result){
        if (!result || result.success === false) {
          showError({message: result && result.error ? result.error : 'No data returned.'});
          return;
        }
        render(result);
      },
      function(message){
        showError({message: message});
      }
    );

  }


  function applyPeriod() {
    loadData();
  }


  function resetPeriod() {
    setDefaultPeriodDates();
    loadData();
  }


  function showPeriodError(message) {
    var box = document.getElementById('periodError');
    box.textContent = message;
    box.style.display = 'block';
  }


  function setDefaultPeriodDates() {
    var today = new Date();
    var first = new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

    document.getElementById('managementFrom').value = formatDateInput(first);
    document.getElementById('managementTo').value = formatDateInput(today);
  }


  function formatDateInput(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }



  function requestAIAnalysis(forceRefresh) {

    var body = document.getElementById('aiAnalysisBody');

    if (!body) return;

    body.innerHTML = `
      <div class="ai-loading">
        <div class="ai-spinner"></div>
        Generating management analysis...
      </div>
    `;

    var from = document.getElementById('managementFrom').value;
    var to = document.getElementById('managementTo').value;

    callFnbApi(
      'management_ai',
      {
        from: from,
        to: to,
        outletId: '',
        poolId: '',
        forceRefresh: !!forceRefresh
      },
      renderAIAnalysis,
      function(message){
        renderAIError(message);
      }
    );
  }


  function renderAIError(message) {

    var body = document.getElementById('aiAnalysisBody');

    if (!body) return;

    body.innerHTML = `
      <div class="ai-error">
        <strong>AI analysis is not available.</strong>
        <br><br>
        ${esc(message || 'Unknown error.')}
        <br><br>
        Add the OpenAI API key to the Apps Script project property
        <b>OPENAI_API_KEY</b>, then press <b>REFRESH AI</b>.
      </div>
    `;
  }


  function renderAIAnalysis(result) {

    var body = document.getElementById('aiAnalysisBody');

    if (!body) return;

    if (!result || result.success === false) {

      renderAIError(
        result && result.error
          ? result.error
          : 'No AI analysis was returned.'
      );

      return;
    }

    if (result.configured === false) {

      renderAIError(
        'OpenAI API key is not configured in this Apps Script project.'
      );

      return;
    }

    var a = result.analysis || {};

    var html = '';

    if (a.executiveSummary) {
      html += `
        <div class="ai-summary">
          <strong>Executive Summary</strong>
          <div style="margin-top:6px">
            ${esc(a.executiveSummary)}
          </div>
        </div>
      `;
    }

    html += '<div class="ai-grid">';

    html += `
      <div class="ai-box">
        <h4>✅ Strengths</h4>
        ${
          renderAIList(
            a.strengths,
            'No material strengths identified.'
          )
        }
      </div>
    `;

    html += `
      <div class="ai-box">
        <h4>⚠️ Risks / Weaknesses</h4>
        ${
          renderAIList(
            a.risks,
            'No material risks identified.'
          )
        }
      </div>
    `;

    html += `
      <div class="ai-box">
        <h4>💡 Opportunities</h4>
        ${
          renderAIList(
            a.opportunities,
            'No clear opportunities identified.'
          )
        }
      </div>
    `;

    html += `
      <div class="ai-box">
        <h4>🎯 Management Focus</h4>
        ${
          renderAIList(
            a.managementFocus,
            'No additional management focus identified.'
          )
        }
      </div>
    `;

    html += '</div>';

    if (Array.isArray(a.actions) && a.actions.length) {

      html += `
        <div style="margin-top:14px">
          <div class="section-title" style="margin-bottom:8px">
            AI Recommended Actions
          </div>
      `;

      a.actions.forEach(function(action){

        var priority =
          String(
            action.priority || 'MEDIUM'
          ).toLowerCase();

        if (['high','medium','low'].indexOf(priority) < 0) {
          priority = 'medium';
        }

        html += `
          <div class="ai-action">

            <div class="ai-action-top">

              <div>
                ${esc(action.title || 'Management Action')}
              </div>

              <span class="ai-priority ${priority}">
                ${esc(String(action.priority || 'MEDIUM').toUpperCase())}
              </span>

            </div>

            <p>
              ${esc(action.action || '')}
            </p>

            ${
              action.why
                ? `<p class="ai-why"><b>Why:</b> ${esc(action.why)}</p>`
                : ''
            }

          </div>
        `;
      });

      html += '</div>';
    }

    if (Array.isArray(a.keyQuestions) && a.keyQuestions.length) {

      html += `
        <div class="ai-box" style="margin-top:14px">
          <h4>❓ Questions Management Should Check</h4>
          ${renderAIList(a.keyQuestions, '')}
        </div>
      `;
    }

    html += `
      <div class="ai-footer">
        AI model: ${esc(result.model || 'OpenAI')}
        ${result.cached ? ' • Cached result' : ' • Fresh analysis'}
        ${
          result.generatedAt
            ? ' • Generated: ' + esc(result.generatedAt)
            : ''
        }
        <br>
        AI is advisory. Financial amounts, percentages and source data remain controlled by the F&B Analytics engine.
      </div>
    `;

    body.innerHTML = html;
  }


  function renderAIList(items, emptyText) {

    if (!Array.isArray(items) || !items.length) {

      return `
        <div style="font-size:11px;color:#7a858c">
          ${esc(emptyText || '—')}
        </div>
      `;
    }

    return `
      <ul class="ai-list">
        ${
          items.slice(0, 8).map(function(item){
            return '<li>' + esc(item) + '</li>';
          }).join('')
        }
      </ul>
    `;
  }



  function goPwaHome() {
    try {
      if (window.top !== window.self) {
        window.top.location.href = 'https://ahmedhasanin1.github.io/fnb-control/?pwa=12#home';
        return;
      }
    } catch (e) {}
    window.location.href = 'https://ahmedhasanin1.github.io/fnb-control/?pwa=12#home';
  }


  function printManagementReport() {

    var from = document.getElementById('managementFrom')
      ? document.getElementById('managementFrom').value
      : '';

    var to = document.getElementById('managementTo')
      ? document.getElementById('managementTo').value
      : '';

    if (!from || !to) {
      alert('Please select the analysis period first.');
      return;
    }

    window.print();

  }


  function showError(error) {

    document.getElementById(
      'content'
    ).innerHTML = `

      <div class="error">

        <strong>
          Unable to load Management Intelligence
        </strong>

        <br><br>

        ${esc(
          error &&
          error.message
            ? error.message
            : error
        )}

      </div>

    `;

  }


  function render(data) {

    if (
      !data ||
      data.success === false
    ) {

      showError({
        message:
          data &&
          data.error
            ? data.error
            : 'No data returned.'
      });

      return;

    }


    var overall =
      data.overall || {};

    var financial =
      data.financial || {};

    var dq =
      data.dataQuality || {};

    var inventory =
      data.inventory || {};

    var recon =
      data.salesReconciliation || {};

    var actions =
      Array.isArray(data.actions)
        ? data.actions
        : [];


    var status =
      data.dashboardStatus ||
      overall.status ||
      'ATTENTION_REQUIRED';


    var html = '';


    /* PERIOD */

    html += `

      <div class="period">

        <strong>Analysis Period:</strong>

        ${esc(
          data.period &&
          data.period.from
            ? data.period.from
            : '—'
        )}

        →

        ${esc(
          data.period &&
          data.period.to
            ? data.period.to
            : '—'
        )}

      </div>

    `;


    /* STATUS */

    html += `

      <div class="status-card ${statusClass(status)}">

        <div class="status-label">
          Management Status
        </div>

        <div class="status-value">
          ${statusText(status)}
        </div>

        <div class="status-message">

          ${esc(
            overall.managementMessage ||
            'Management review required.'
          )}

        </div>

      </div>

    `;


    /* FINANCIAL */

    html += `

      <div class="section-title">
        Financial Performance
      </div>

      <div class="grid">

        <div class="kpi orange">

          <div class="kpi-label">
            Gross Sales
          </div>

          <div class="kpi-value">
            ${money(financial.grossSales)}
          </div>

        </div>


        <div class="kpi">

          <div class="kpi-label">
            Net Sales
          </div>

          <div class="kpi-value">
            ${money(financial.netSales)}
          </div>

        </div>


        <div class="kpi">

          <div class="kpi-label">
            Total Checks
          </div>

          <div class="kpi-value">
            ${number(financial.totalChecks)}
          </div>

        </div>


        <div class="kpi">

          <div class="kpi-label">
            Average Check
          </div>

          <div class="kpi-value">
            ${money(financial.averageCheck)}
          </div>

        </div>


        <div class="kpi">

          <div class="kpi-label">
            Known Cost
          </div>

          <div class="kpi-value">
            ${money(financial.knownTheoreticalCost)}
          </div>

        </div>


        <div class="kpi">

          <div class="kpi-label">
            Known Gross Profit
          </div>

          <div class="kpi-value">
            ${money(financial.knownGrossProfit)}
          </div>

        </div>


        <div class="kpi">

          <div class="kpi-label">
            Cost %
          </div>

          <div class="kpi-value">
            ${percent(financial.knownCostPercent)}
          </div>

        </div>


        <div class="kpi green">

          <div class="kpi-label">
            Gross Profit %
          </div>

          <div class="kpi-value">
            ${percent(financial.knownGrossProfitPercent)}
          </div>

        </div>

      </div>

    `;


    /* DATA QUALITY */

    html += `

      <div class="section-title">
        Data Quality
      </div>

      <div class="grid">

        <div class="kpi">

          <div class="kpi-label">
            Completeness
          </div>

          <div class="kpi-value">
            ${percent(
              dq.completenessPercent
            )}
          </div>

        </div>


        <div class="kpi">

          <div class="kpi-label">
            Sold Products
          </div>

          <div class="kpi-value">
            ${number(
              dq.soldProducts
            )}
          </div>

        </div>


        <div class="kpi red">

          <div class="kpi-label">
            Missing Cost
          </div>

          <div class="kpi-value">
            ${number(
              dq.missingCostCount
            )}
          </div>

        </div>


        <div class="kpi red">

          <div class="kpi-label">
            Qty Mismatch
          </div>

          <div class="kpi-value">
            ${number(
              dq.quantityMismatchCount
            )}
          </div>

        </div>


        <div class="kpi red">

          <div class="kpi-label">
            No Inventory Movement
          </div>

          <div class="kpi-value">
            ${number(
              dq.noInventoryMovementCount
            )}
          </div>

        </div>


        <div class="kpi red">

          <div class="kpi-label">
            Negative Stock
          </div>

          <div class="kpi-value">
            ${number(
              inventory.negativeStockCount
            )}
          </div>

        </div>

      </div>

    `;


    /* RECONCILIATION */

    html += `

      <div class="section-title">
        Sales Reconciliation
      </div>

      <div class="recon">

        <div class="recon-row">

          <span class="recon-label">
            Header Sales
          </span>

          <span class="recon-value">
            ${money(
              recon.grossSales
            )}
          </span>

        </div>


        <div class="recon-row">

          <span class="recon-label">
            Detail Sales
          </span>

          <span class="recon-value">
            ${money(
              recon.detailSales
            )}
          </span>

        </div>


        <div class="recon-row">

          <span class="recon-label">
            Difference
          </span>

          <span class="recon-value
            ${
              recon.status === 'MATCH'
                ? 'match'
                : 'difference'
            }">

            ${money(
              recon.difference
            )}

          </span>

        </div>


        <div class="recon-row">

          <span class="recon-label">
            Difference %
          </span>

          <span class="recon-value
            ${
              recon.status === 'MATCH'
                ? 'match'
                : 'difference'
            }">

            ${percent(
              recon.differencePercent
            )}

          </span>

        </div>


        <div class="recon-row">

          <span class="recon-label">
            Status
          </span>

          <span class="recon-value
            ${
              recon.status === 'MATCH'
                ? 'match'
                : 'difference'
            }">

            ${esc(
              recon.status ||
              '—'
            )}

          </span>

        </div>

      </div>

    `;


    /* ACTIONS */

    html += `

      <div class="section-title">
        Management Actions
      </div>

    `;


    if (!actions.length) {

      html += `

        <div class="empty">

          ✓ No immediate management actions detected.

        </div>

      `;

    } else {

      actions.forEach(
        function(action) {

          var priority =
            String(
              action.priority ||
              'MEDIUM'
            ).toLowerCase();

          html += `

            <div class="action ${priority}">

              <div class="action-top">

                <div class="action-title">

                  ${esc(
                    action.title ||
                    action.type
                  )}

                </div>

                <div class="priority ${priority}">

                  ${esc(
                    action.priority ||
                    'MEDIUM'
                  )}

                </div>

              </div>


              <div class="action-message">

                ${esc(
                  action.message ||
                  ''
                )}

              </div>


              <div class="action-do">

                Action:
                ${esc(
                  action.action ||
                  ''
                )}

              </div>

            </div>

          `;

        }
      );

    }


    /* HYBRID AI MANAGEMENT ANALYSIS */

    html += `

      <div class="ai-panel">

        <div class="ai-head">

          <div class="ai-head-left">

            <div class="ai-icon">🧠</div>

            <div>

              <div class="ai-title">
                AI Management Analysis
              </div>

              <div class="ai-subtitle">
                Numerical facts come from F&B Analytics. AI interprets the results and recommends management actions.
              </div>

            </div>

          </div>

          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">

            <span class="ai-badge">HYBRID AI</span>

            <button class="ai-refresh" type="button" onclick="requestAIAnalysis(true)">
              ↻ REFRESH AI
            </button>

          </div>

        </div>

        <div class="ai-body" id="aiAnalysisBody">

          <div class="ai-loading">

            <div class="ai-spinner"></div>

            Generating management analysis...

          </div>

        </div>

      </div>

    `;


    /* FOOTER */

    html += `

      <div class="footer">

        Generated:
        ${esc(
          data.generatedAt ||
          ''
        )}

        <br>

        Blue Reef Resort • F&B Control Center

      </div>

    `;


    document.getElementById(
      'content'
    ).innerHTML = html;

    requestAIAnalysis(false);

  }


  /* INITIAL LOAD */

  setDefaultPeriodDates();
  loadData();

</script>

</body>
</html>
